backend:
  name: git-gateway
  branch: main

media_folder: "novels"
public_folder: "/novels"

collections:
  - name: "novels"
    label: "Novels"
    folder: "novels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Folder Name", name: "slug", widget: "string", hint: "e.g. first-novel, second-novel" }
      - label: "Files"
        name: "files"
        widget: "list"
        fields:
          - { label: "Label", name: "label", widget: "string", hint: "e.g. Standard Version, Expanded Version, Illustrated Edition" }
          - { label: "File", name: "file", widget: "file" }
